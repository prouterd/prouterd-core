name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rspec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
        experimental: [false]
        # Ruby 4.0 was released 2025-12-25. Running it here as
        # `continue-on-error: true` so a Ruby 4.x regression shows up
        # as a yellow square (informational), not a red one blocking
        # main. Promote to required once 4.1 lands ZJIT as production-
        # ready and we adopt it as the dev pin.
        include:
          - ruby: "4.0"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run RSpec with coverage gate
        # COVERAGE=1 activates simplecov; the spec_helper's
        # `minimum_coverage line: 100, branch: 100` exits non-zero on
        # any drop, blocking the merge.
        run: COVERAGE=1 bundle exec rspec --format progress
        continue-on-error: ${{ matrix.experimental }}
      - name: Upload coverage report on failure
        if: failure() && !matrix.experimental
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.ruby }}
          path: coverage/
          retention-days: 7
