# Reference compose file for an prouterd daemon.
#
#   docker compose up        # builds + runs in foreground
#   docker compose up -d     # detached
#   docker compose logs -f   # tail logs
#   docker compose exec -T prouterd sh -lc 'printf "enable\nshow runs\n" | bundle exec ruby exe/prouter shell --db /data/prouterd.db'
#
# The daemon binary is exe/prouterd; the operator CLI is exe/prouter.
# The container's default ENTRYPOINT runs the daemon — for one-shot
# CLI commands inside an already-running container, use `compose exec`
# as shown above.
#
# The Docker-socket mount is REQUIRED for `interface docker` blocks. If you
# only use `interface shell` blocks, comment that line out.
services:
  prouterd:
    build: .
    image: prouterd:latest
    ports:
      # Bound to loopback so the daemon isn't exposed to the world by
      # default. For multi-host or LAN access put a TLS-terminating
      # reverse proxy (nginx, caddy, traefik) in front and change to
      # "8080:8080".
      - "127.0.0.1:8080:8080"
    environment:
      PROUTERD_ADMIN_TOKEN: changeme         # required for /v1/* admin routes
      PROUTERD_WEBHOOK_RATE: 60/1            # max 60 req/sec per webhook iface
      TZ: UTC
    volumes:
      - prouterd-data:/data
      # Allow the daemon to spawn child containers on the host's Docker daemon.
      # Comment out for pure shell-block pipelines.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ruby -rnet/http -e 'exit Net::HTTP.get_response(URI(\"http://127.0.0.1:8080/v1/status\")).code == \"200\" ? 0 : 1'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  prouterd-data:
